services:
  web:
    build: .
    restart: unless-stopped
    ports:
      # Слева — порт на самом сервере, справа — порт внутри контейнера.
      # Если 8000 уже занят на сервере, поменяйте только левое число, например "8080:8000".
      - "8000:8000"
    volumes:
      # Все изменяемые данные (база SQLite, сгенерированные документы, бэкапы)
      # хранятся в этой папке НА СЕРВЕРЕ, а не внутри контейнера — так они не
      # теряются при обновлении образа (docker compose build / up --build).
      - ./data:/app/data
    environment:
      DJANGO_DATA_DIR: /app/data

      # ОБЯЗАТЕЛЬНО замените на свою длинную случайную строку перед запуском
      # в реальной эксплуатации. Сгенерировать: см. DEPLOY.md.
      DJANGO_SECRET_KEY: "замените-меня-на-случайную-строку"

      DJANGO_DEBUG: "False"

      # Перечислите через запятую IP-адрес и/или имя сервера, по которому
      # сотрудники будут заходить в систему.
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"

      # Необязательно: если заданы оба значения, при первом запуске
      # автоматически создастся администратор для /admin/ с этим логином/паролем.
      # После первого запуска можно убрать (или сменить пароль через /admin/).
      DJANGO_SUPERUSER_USERNAME: "admin"
      DJANGO_SUPERUSER_PASSWORD: "замените-меня"
